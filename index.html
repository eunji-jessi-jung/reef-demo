<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="assets/img/favicon.svg?v=b5378351" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg?v=b5378351">
  <meta name="color-scheme" content="dark">
  <style>html{background:#061714;color-scheme:dark}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/site.css?v=90b4b7fc">
  <title>reef — 거듭할수록 쌓이는 지식</title>
  <meta name="description" content="reef reads your repositories and your company's documents and builds something that answers questions — with sources, and with the gaps left standing as unknown.">
</head>
<body data-base=".">
  <header class="topbar">
    <a class="brand" href="index.html"><svg class="brand-mark" viewBox="0 0 28 22" aria-hidden="true">
        <path d="M2 8.4c2.2-3.6 4.4-3.6 6.6 0s4.4 3.6 6.6 0 4.4-3.6 6.6 0 2.6 2 4.2 0"
              fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M2 16.2c2.2-3.6 4.4-3.6 6.6 0s4.4 3.6 6.6 0 4.4-3.6 6.6 0 2.6 2 4.2 0"
              fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".4"/>
      </svg> <span>reef</span></a>
    <div class="bar-end" id="gnb">
    <nav class="nav">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="try.html"   data-i18n="nav.try"></a>
      <a href="about.html" data-i18n="nav.about"></a>
    </nav>
    <div class="lang">
      <button data-lang="ko" aria-pressed="true">한국어</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <button class="menu-toggle" data-menu-toggle aria-expanded="false"
            aria-controls="gnb" data-i18n-aria="ui.menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round">
        <path class="bar-a" d="M4 7h16"/><path class="bar-b" d="M4 12h16"/><path class="bar-c" d="M4 17h16"/>
      </svg>
    </button>
  </header>

  <main>
    <!-- The hero, and the product in the same screen. The references that do this
         well never make you click through to see the thing work, so the recorded pair
         sits here, cropped by the fold. -->
    <section class="hero" id="top">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="kicker" data-i18n="L.kicker"></p>
          <h1 class="hero-h1" data-i18n="L.h1"></h1>
          <p class="hero-desc" data-i18n="L.sub"></p>
          <div class="cta-row">
            <a class="cta" href="try.html"><span data-i18n="L.cta"></span> <em>&#8594;</em></a>
            <p class="cta-note" data-i18n="L.ctaNote"></p>
          </div>
        </div>
      </div>
      <div class="hero-demo">
        <div class="compare" id="hero-pair"></div>
      </div>
    </section>

    <!-- Evidence, immediately. Not at the bottom. -->
    <section class="band band-strip">
      <div class="band-inner">
        <p class="section-label" data-i18n="L.cLabel"></p>
        <h2 data-i18n="L.cTitle"></h2>
        <div class="figures" id="eval-figures"></div>
        <p class="body" data-i18n="L.stripNote"></p>
        <p class="meta" data-i18n="L.pairNote"></p>
        <a class="cta cta-quiet" href="about.html"><span data-i18n="L.cCta"></span> <em>&#8594;</em></a>
      </div>
    </section>

<section class="band" id="how">
      <div class="band-inner">
        <p class="section-label" data-i18n="L.fLabel"></p>
        <h2 data-i18n="L.fTitle"></h2>
        <p class="body" data-i18n="L.fLede"></p>

        <p class="phase" data-i18n="L.fPhase1"></p>
        <ol class="flow">
          <li><code>/reef:init</code><span data-i18n="L.f1"></span></li>
          <li><code>/reef:snorkel</code><code>/reef:source</code><span data-i18n="L.f2"></span></li>
          <li><code>/reef:scuba</code><span data-i18n="L.f3"></span></li>
          <li><code>/reef:test</code><span data-i18n="L.f4"></span></li>
        </ol>

        <p class="phase" data-i18n="L.fPhase2"></p>
        <ol class="flow">
          <li><code>/reef:update</code><span data-i18n="L.f5"></span></li>
          <li><code>/reef:feed</code><span data-i18n="L.f6"></span></li>
          <li><code>/reef:ask</code><span data-i18n="L.f7"></span></li>
          <li class="is-human"><span class="who" data-i18n="L.fHuman"></span><span data-i18n="L.f8"></span></li>
        </ol>
        <p class="loop-back"><span class="loop-mark" aria-hidden="true">&#8630;</span><span data-i18n="L.fLoop"></span></p>

        <a class="cta" href="try.html"><span data-i18n="L.fCta"></span> <em>&#8594;</em></a>
      </div>
    </section>
<section class="band">
      <div class="band-inner">
        <p class="section-label" data-i18n="L.vLabel"></p>
        <h2 data-i18n="L.vTitle"></h2>
        <p class="body" data-i18n="L.vLede"></p>
        <ol class="questions">
          <li><b data-i18n="L.q1t"></b><span data-i18n="L.q1b"></span></li>
          <li><b data-i18n="L.q2t"></b><span data-i18n="L.q2b"></span></li>
          <li><b data-i18n="L.q3t"></b><span data-i18n="L.q3b"></span></li>
        </ol>

        <h3 data-i18n="L.diffTitle"></h3>
        <table class="diff">
          <thead>
            <tr><th></th><th data-i18n="L.diffHeadA"></th><th class="is-reef" data-i18n="L.diffHeadB"></th></tr>
          </thead>
          <tbody>
            <tr><th data-i18n="L.d1k"></th><td data-i18n="L.d1a"></td><td class="is-reef" data-i18n="L.d1b"></td></tr>
            <tr><th data-i18n="L.d2k"></th><td data-i18n="L.d2a"></td><td class="is-reef" data-i18n="L.d2b"></td></tr>
            <tr><th data-i18n="L.d3k"></th><td data-i18n="L.d3a"></td><td class="is-reef" data-i18n="L.d3b"></td></tr>
          </tbody>
        </table>
        <p class="body" data-i18n="L.diffNote"></p>
      </div>
    </section>
<section class="band">
      <div class="band-inner">
        <p class="section-label" data-i18n="L.sLabel"></p>
        <h2 data-i18n="L.sTitle"></h2>
        <p class="body" data-i18n="L.sLede"></p>
        <div class="grid2 fit">
          <div class="fit-yes">
            <p class="phase" data-i18n="L.sFitT"></p>
            <p class="body" data-i18n="L.sFit"></p>
          </div>
          <div class="fit-no">
            <p class="phase" data-i18n="L.sUnfitT"></p>
            <p class="body" data-i18n="L.sUnfit"></p>
          </div>
        </div>

        <h3 data-i18n="L.sBenchT"></h3>
        <p class="body" data-i18n="L.sBench"></p>
        <table class="bench" id="bench"></table>
        <p class="body caution" data-i18n="L.sNeg"></p>
        <a class="cta cta-quiet" href="about.html"><span data-i18n="L.sCta"></span> <em>&#8594;</em></a>
      </div>
    </section>
    <aside class="artifact-panel" id="artifact" hidden>
      <div class="artifact-head">
        <p class="artifact-title"></p>
        <button class="artifact-close" data-i18n="chat.close"></button>
      </div>
      <div class="artifact-body"></div>
      <a class="artifact-link src" target="_blank" rel="noopener" data-i18n="chat.open"></a>
    </aside>

  </main>

  <footer>
    <p class="meta" data-i18n="L.foot"></p>
  </footer>

  <script type="module" src="assets/js/landing.js?v=8b4a6829"></script>
</body>
</html>
